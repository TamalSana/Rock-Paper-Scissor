<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src = "rps.js"></script>
    <title>Document</title>
</head> 
<body>
    <div class="game-container">
        <h1>Rock Paper Scissors</h1>
        <div class="buttons-container">
            <button id="rock" class="choice-btn">
                <img src="images/rock.jpg" alt="Rock">
                <span>Rock</span>
            </button>
            <button id="paper" class="choice-btn">
                <img src="images/paper.jpg" alt="Paper">
                <span>Paper</span>
            </button>
            <button id="scissors" class="choice-btn">
                <img src="images/scissors.jpg" alt="Scissors">
                <span>Scissors</span>
            </button>
        </div>
        <div id="results" class="results-panel">
            <p>Choose your weapon to start the game!</p>
        </div>
    </div>
</body>
</html>
